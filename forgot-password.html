<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credential Recovery | STACKLY Risk Management</title>
    <!-- Google Fonts & Material Symbols (No SVGs, No Emojis) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Public+Sans:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="./css/style.css">
    <script>
        // Prompt requirement: "Forgot password must redirect to: 404.html"
        function handleRecovery(e) {
            e.preventDefault();
            window.location.href = './404.html';
        }
    </script>
</head>
<body>

    <!-- PRELOADER -->
    <div class="preloader">
        <div class="preloader-inner">
            <img src="./images/logo-dark.webp" alt="STACKLY Logo" class="preloader-logo">
            <div class="preloader-bar"><span></span></div>
            <div class="preloader-text">Securing Session</div>
        </div>
    </div>

    <div class="auth-page-wrap">
        <div class="auth-card fade-up active">
            <div class="auth-header">
                <a href="./index.html" class="auth-logo">
                    <img src="./images/logo-dark.webp" alt="STACKLY Logo">
                </a>
                <h1 style="font-size: 1.65rem; color: var(--primary); margin-bottom: 0.35rem;">Password Reset Request</h1>
                <p style="font-size: 0.88rem; color: var(--primary-70);">Provide your authorized enterprise email for credential routing.</p>
            </div>

            <form onsubmit="handleRecovery(event)" novalidate>
                <div class="form-group">
                    <label for="recovery-email" class="form-label">Corporate Email Address</label>
                    <input type="email" id="recovery-email" class="form-control" placeholder="name@company.com" required value="shobitha@gmail.com">
                </div>

                <div style="background: var(--accent); padding: 1rem; border-radius: 4px; border-left: 3px solid var(--secondary); margin-bottom: 1.5rem; font-size: 0.82rem; color: var(--primary-85);">
                    <div style="font-weight: 700; margin-bottom: 2px;">Governance Notice:</div>
                    Password resets for privileged client accounts require automated security validation.
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; margin-bottom: 1.25rem;">
                    <span>Transmit Reset Dispatch</span>
                    <span class="material-symbols-outlined">send</span>
                </button>

                <div style="text-align: center; font-size: 0.88rem; color: var(--primary-70);">
                    Remembered password? <a href="./login.html" style="color: var(--secondary); font-weight: 700;">Back to Login</a>
                </div>
            </form>

            <div style="margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--primary-08); text-align: center; font-size: 0.78rem;">
                <a href="./index.html" style="color: var(--primary); font-weight: 600; display: inline-flex; align-items: center; gap: 4px;">
                    <span class="material-symbols-outlined" style="font-size: 16px;">arrow_back</span>
                    <span>Return to Public Homepage</span>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
