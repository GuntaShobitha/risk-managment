<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Login | STACKLY Risk Management</title>
    <meta name="description" content="Secure client and administrator login portal for STACKLY Risk Intelligence platform.">
    <!-- Google Fonts & Material Symbols (No SVGs, No Emojis) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <!-- PRELOADER -->
    <div class="preloader">
        <div class="preloader-inner">
            <img src="./images/logo-dark.webp" alt="STACKLY Logo" class="preloader-logo">
            <div class="preloader-bar"><span></span></div>
            <div class="preloader-text">Securing Session</div>
        </div>
    </div>

    <div class="auth-page-wrap">
        <div class="auth-card fade-up active">
            <div class="auth-header">
                <a href="./index.html" class="auth-logo">
                    <img src="./images/logo-dark.webp" alt="STACKLY Logo">
                </a>
                <h1 style="font-size: 1.65rem; color: var(--primary); margin-bottom: 0.35rem;">Client &amp; Governance Portal</h1>
                <p style="font-size: 0.88rem; color: var(--primary-70);">Authenticate with your corporate credentials.</p>
            </div>

            <!-- Role Selector: User vs Admin -->
            <div class="auth-role-toggle">
                <button type="button" class="role-btn active" data-role="User">
                    <span class="material-symbols-outlined" style="font-size: 18px; vertical-align: middle; margin-right: 4px;">person</span>
                    User Portal
                </button>
                <button type="button" class="role-btn" data-role="Admin">
                    <span class="material-symbols-outlined" style="font-size: 18px; vertical-align: middle; margin-right: 4px;">admin_panel_settings</span>
                    Admin Portal
                </button>
            </div>

            <form id="stackly-login-form" novalidate>
                <input type="hidden" id="auth-role-input" value="User">

                <div class="form-group">
                    <label for="login-email" class="form-label">Corporate Email Address</label>
                    <div style="position: relative;">
                        <input type="email" id="login-email" class="form-control" placeholder="name@company.com" required>
                        <span class="material-symbols-outlined" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--primary-40); pointer-events: none;">mail</span>
                    </div>
                    <div class="form-error" id="login-email-error"></div>
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
                        <label for="login-password" class="form-label" style="margin-bottom: 0;">Password</label>
                        <a href="./forgot-password.html" class="forgot-password-link" style="font-size: 0.82rem; color: var(--secondary); font-weight: 600;">Forgot Password?</a>
                    </div>
                    <div style="position: relative;">
                        <input type="password" id="login-password" class="form-control" placeholder="Enter password" required>
                        <button type="button" class="password-toggle-btn" data-target="login-password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--primary-70); cursor: pointer;" aria-label="Toggle password visibility">
                            <span class="material-symbols-outlined" style="font-size: 20px;">visibility</span>
                        </button>
                    </div>
                    <div class="form-error" id="login-password-error"></div>
                </div>

                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.75rem; font-size: 0.88rem;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--primary-85);">
                        <input type="checkbox" id="login-remember" checked style="accent-color: var(--secondary); width: 16px; height: 16px;">
                        <span>Remember credentials</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; margin-bottom: 1.25rem;">
                    <span>Secure Sign In</span>
                    <span class="material-symbols-outlined">login</span>
                </button>

                <div style="text-align: center; font-size: 0.88rem; color: var(--primary-70);">
                    Need enterprise access? <a href="./register.html" style="color: var(--secondary); font-weight: 700;">Create an Account</a>
                </div>
            </form>

            <div style="margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--primary-08); text-align: center; font-size: 0.78rem; color: var(--primary-70);">
                Protected by institutional zero-trust encryption.<br>
                <a href="./index.html" style="color: var(--primary); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; margin-top: 6px;">
                    <span class="material-symbols-outlined" style="font-size: 16px;">arrow_back</span>
                    <span>Return to Public Homepage</span>
                </a>
            </div>
        </div>
    </div>

    <script src="./js/auth.js"></script>
</body>
</html>
