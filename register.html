<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Registration | STACKLY Risk Management</title>
    <meta name="description" content="Register an enterprise account for STACKLY Risk Management intelligence portal.">
    <!-- Google Fonts & Material Symbols (No SVGs, No Emojis) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <!-- PRELOADER -->
    <div class="preloader">
        <div class="preloader-inner">
            <img src="./images/logo-dark.webp" alt="STACKLY Logo" class="preloader-logo">
            <div class="preloader-bar"><span></span></div>
            <div class="preloader-text">Securing Session</div>
        </div>
    </div>

    <div class="auth-page-wrap">
        <div class="auth-card fade-up active" style="max-width: 520px;">
            <div class="auth-header">
                <a href="./index.html" class="auth-logo">
                    <img src="./images/logo-dark.webp" alt="STACKLY Logo">
                </a>
                <h1 style="font-size: 1.65rem; color: var(--primary); margin-bottom: 0.35rem;">Enterprise Account Setup</h1>
                <p style="font-size: 0.88rem; color: var(--primary-70);">Register your organization for risk intelligence access.</p>
            </div>

            <!-- Role Selector: User vs Admin -->
            <div class="auth-role-toggle">
                <button type="button" class="role-btn active" data-role="User">
                    <span class="material-symbols-outlined" style="font-size: 18px; vertical-align: middle; margin-right: 4px;">person</span>
                    User Role
                </button>
                <button type="button" class="role-btn" data-role="Admin">
                    <span class="material-symbols-outlined" style="font-size: 18px; vertical-align: middle; margin-right: 4px;">admin_panel_settings</span>
                    Admin Role
                </button>
            </div>

            <form id="stackly-register-form" novalidate>
                <input type="hidden" id="auth-role-input" value="User">

                <div class="form-group">
                    <label for="register-name" class="form-label">Full Name *</label>
                    <input type="text" id="register-name" class="form-control" placeholder="e.g. Shobitha Rao" required>
                    <div class="form-error" id="register-name-error"></div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="register-email" class="form-label">Corporate Email *</label>
                        <input type="email" id="register-email" class="form-control" placeholder="shobitha@gmail.com" required>
                        <div class="form-error" id="register-email-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="register-phone" class="form-label">Phone Number *</label>
                        <input type="tel" id="register-phone" class="form-control" placeholder="+1 (555) 234-5678" required>
                        <div class="form-error" id="register-phone-error"></div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="register-password" class="form-label">Password *</label>
                        <div style="position: relative;">
                            <input type="password" id="register-password" class="form-control" placeholder="Min 6 characters" required>
                            <button type="button" class="password-toggle-btn" data-target="register-password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--primary-70); cursor: pointer;" aria-label="Toggle password visibility">
                                <span class="material-symbols-outlined" style="font-size: 20px;">visibility</span>
                            </button>
                        </div>
                        <div class="form-error" id="register-password-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="register-confirm-password" class="form-label">Confirm Password *</label>
                        <div style="position: relative;">
                            <input type="password" id="register-confirm-password" class="form-control" placeholder="Repeat password" required>
                            <button type="button" class="password-toggle-btn" data-target="register-confirm-password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--primary-70); cursor: pointer;" aria-label="Toggle password visibility">
                                <span class="material-symbols-outlined" style="font-size: 20px;">visibility</span>
                            </button>
                        </div>
                        <div class="form-error" id="register-confirm-error"></div>
                    </div>
                </div>

                <div style="margin-bottom: 1.5rem; font-size: 0.82rem; color: var(--primary-70);">
                    By registering, you agree to STACKLY's <a href="./404.html" style="color: var(--secondary); font-weight: 600;">Governance &amp; Confidentiality Charters</a>.
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; margin-bottom: 1.25rem;">
                    <span>Complete Registration</span>
                    <span class="material-symbols-outlined">how_to_reg</span>
                </button>

                <div style="text-align: center; font-size: 0.88rem; color: var(--primary-70);">
                    Already registered? <a href="./login.html" style="color: var(--secondary); font-weight: 700;">Sign In</a>
                </div>
            </form>

            <div style="margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--primary-08); text-align: center; font-size: 0.78rem; color: var(--primary-70);">
                <a href="./index.html" style="color: var(--primary); font-weight: 600; display: inline-flex; align-items: center; gap: 4px;">
                    <span class="material-symbols-outlined" style="font-size: 16px;">arrow_back</span>
                    <span>Return to Public Homepage</span>
                </a>
            </div>
        </div>
    </div>

    <script src="./js/auth.js"></script>
</body>
</html>
